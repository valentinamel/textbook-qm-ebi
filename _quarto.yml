project:
  type: book
  output-dir: docs
  execute-dir: project
  resources:
    - assets/widgets/
    - data/shark_tank_teaching.csv
    - data/qm-intermediate-mock-exam.csv

book:
  title: 'Quantitative Methods to Understand E&BI'
  site-url: https://valentinamel.github.io/textbook-qm-ebi/
  # repo-url intentionally unset: no GitHub icon in the student-facing
  # sidebar (the repo is a maintenance detail, not a student destination).
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: basic/overview.qmd
      chapters:
        - basic/b01-introduction-data-analysis.qmd
        - basic/b02-probability-foundations.qmd
        - basic/b03-discrete-distributions.qmd
        - basic/t01-exam-prep.qmd
        - basic/b04-conditioning-bayes-independence.qmd
        - basic/b05-joint-covariance-correlation.qmd
        - basic/t02-exam-prep.qmd
        - basic/b06-continuous-normal.qmd
        - basic/b07-samples-estimators.qmd
        - basic/b08-sampling-distributions.qmd
        - basic/t03-exam-prep.qmd
        - basic/b09-t-confidence-intervals.qmd
        - basic/b10-testing-errors-power.qmd
        - basic/t04-exam-prep.qmd
        - basic/formula-sheet.qmd
        - basic/mock-exam.qmd
    - part: intermediate/overview.qmd
      chapters:
        - intermediate/i01-simple-linear-regression.qmd
        - intermediate/i02-assumptions-diagnostics.qmd
        - intermediate/i03-inference-fit-ftest.qmd
        - intermediate/t01-exam-prep.qmd
        - intermediate/i04-multiple-regression.qmd
        - intermediate/i05-categories-joint-tests.qmd
        - intermediate/i06-interactions-curvature.qmd
        - intermediate/t02-exam-prep.qmd
        - intermediate/code-sheet.qmd
        - intermediate/mock-exam.qmd
    - part: advanced/overview.qmd
      chapters: []
    - part: "Supplementary resources"
      chapters:
        - resources/how-to-succeed.qmd
        - resources/r-refresher.qmd
        - resources/math-refresher.qmd
        - resources/video-guide.qmd

execute:
  freeze: auto

number-sections: false

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    toc: true
    toc-depth: 2
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    link-external-newwindow: true
    # Analytics layer (Plausible-style, anonymous, custom events) is added
    # here later via include-after-body: assets/analytics.html — pending the
    # privacy-office note (see project todo).

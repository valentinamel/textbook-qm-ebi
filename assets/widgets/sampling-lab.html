<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sampling distribution lab</title>
<style>
  :root { --navy:#17324D; --teal:#2F7D73; --muted:#5B6976; --line:#D9E0E6; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
         margin: 0; padding: 10px 12px; color:#26313C; background:#fff; font-size:14px; }
  .panels { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel h3 { margin:0 0 2px 0; font-size:0.95rem; color:var(--navy); }
  .panel .sub { color:var(--muted); font-size:0.78rem; margin:0 0 4px 0; min-height:2.2em; }
  canvas { width:100%; height:240px; border:1px solid var(--line); border-radius:4px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-top:10px; }
  .controls label { font-weight:600; color:var(--navy); }
  input[type=range] { width:160px; vertical-align:middle; accent-color: var(--teal); }
  button { font:inherit; font-weight:600; color:#fff; background:var(--teal); border:none;
           border-radius:4px; padding:6px 14px; cursor:pointer; }
  button.secondary { background:#fff; color:var(--navy); border:1.5px solid var(--line); }
  button:active { transform:translateY(1px); }
  .stats { margin-top:8px; font-size:0.85rem; color:var(--muted); line-height:1.5; }
  .stats b { color:var(--navy); }
  @media (max-width:640px){ .panels { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="panels">
  <div class="panel">
    <h3>Population: initial equity offered (%)</h3>
    <p class="sub">All 1,441 recorded pitches. Right-skewed. &mu; = 13.21, &sigma; = 8.44. This never changes.</p>
    <canvas id="pop" width="560" height="240"></canvas>
  </div>
  <div class="panel">
    <h3>Sample means, one dot-column per sample</h3>
    <p class="sub" id="samp-sub">Draw samples of size n and watch the histogram of their means form. Same x-axis as the population.</p>
    <canvas id="means" width="560" height="240"></canvas>
  </div>
</div>
<div class="controls">
  <label>n = <span id="nval">25</span></label>
  <input type="range" id="n" min="2" max="144" value="25">
  <button id="draw1">Draw 1 sample</button>
  <button id="draw100">Draw 100 samples</button>
  <button id="reset" class="secondary">Reset</button>
</div>
<div class="stats" id="stats">No samples drawn yet.</div>

const MU = 13.208, SIGMA = 8.441;
const XMIN = 0, XMAX = 60;                 // shared x-axis
let n = 25, means = [];

function drawHist(canvas, values, binw, color, maxY, meanLine, overlaySE) {
  const c = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
  const padL = 30, padB = 22, padT = 8;
  c.clearRect(0,0,W,H);
  const nb = Math.ceil((XMAX - XMIN)/binw);
  const counts = new Array(nb).fill(0);
  values.forEach(v => { const i = Math.min(nb-1, Math.max(0, Math.floor((v - XMIN)/binw))); counts[i]++; });
  const peak = maxY || Math.max(1, ...counts);
  const xw = (W - padL - 6)/nb;
  c.fillStyle = color;
  counts.forEach((k,i) => {
    if (!k) return;
    const h = (H - padB - padT) * k/peak;
    c.fillRect(padL + i*xw, H - padB - h, Math.max(1, xw - 1), h);
  });
  // axis
  c.strokeStyle = "#8FA3B3"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(padL, H-padB+0.5); c.lineTo(W-4, H-padB+0.5); c.stroke();
  c.fillStyle = "#5B6976"; c.font = "11px sans-serif"; c.textAlign = "center";
  for (let x = XMIN; x <= XMAX; x += 10) {
    const px = padL + (x - XMIN)/(XMAX - XMIN) * (W - padL - 6);
    c.fillText(String(x), px, H - 7);
    c.strokeStyle = "#D9E0E6"; c.beginPath(); c.moveTo(px, H-padB); c.lineTo(px, H-padB+3); c.stroke();
  }
  if (meanLine !== null) {
    const px = padL + (meanLine - XMIN)/(XMAX - XMIN) * (W - padL - 6);
    c.strokeStyle = "#C98B2E"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(px, padT); c.lineTo(px, H-padB); c.stroke();
    c.fillStyle = "#8A6512"; c.textAlign = "left";
    c.fillText("μ", px + 4, padT + 10);
  }
}

function sampleMean(size) {
  let s = 0;
  for (let i=0; i<size; i++) s += data[(Math.random()*data.length)|0];
  return s/size;
}

function redraw() {
  drawHist(document.getElementById("pop"), data, 2, "#B9D2CE", null, MU);
  const binw = 0.5;
  drawHist(document.getElementById("means"), means, binw, "#2F7D73", null, MU);
  const st = document.getElementById("stats");
  if (!means.length) { st.textContent = "No samples drawn yet."; return; }
  const m = means.reduce((a,b)=>a+b,0)/means.length;
  const sd = Math.sqrt(means.reduce((a,b)=>a+(b-m)*(b-m),0)/means.length);
  st.innerHTML = "<b>" + means.length + "</b> samples of n = <b>" + n + "</b> drawn. " +
    "Mean of the sample means: <b>" + m.toFixed(2) + "</b> (population μ = 13.21). " +
    "SD of the sample means: <b>" + sd.toFixed(2) + "</b>; the square-root rule predicts " +
    "σ/√n = 8.44/√" + n + " = <b>" + (SIGMA/Math.sqrt(n)).toFixed(2) + "</b>.";
}

document.getElementById("n").addEventListener("input", e => {
  n = +e.target.value;
  document.getElementById("nval").textContent = n;
  means = [];           // new n starts a new sampling distribution
  redraw();
});
document.getElementById("draw1").addEventListener("click", () => { means.push(sampleMean(n)); redraw(); });
document.getElementById("draw100").addEventListener("click", () => { for (let i=0;i<100;i++) means.push(sampleMean(n)); redraw(); });
document.getElementById("reset").addEventListener("click", () => { means = []; redraw(); });
redraw();
</script>
